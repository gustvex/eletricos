# Publica o site no GitHub Pages a cada push.
#
# Usa o build estatico (`build:static`): base relativa e rotas em hash,
# porque o Pages serve o site em /eletricos/ e nao reescreve rota.
# A API de leads nao sobe aqui — o site funciona sem ela, o catalogo vem
# no bundle e o WhatsApp e link direto.
name: Deploy do site (GitHub Pages)

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; se chegar push novo, cancela o anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Porta de entrada: nada sobe com teste quebrado.
      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build estático
        run: npm run build:static

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-static

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
