# Deploy estático (sem a API de leads). O site funciona completo:
# o catálogo já vem no bundle e o WhatsApp é um link direto.
[build]
  command = "npm run build"
  publish = "web/dist"

# SPA: qualquer rota cai no index.html e o Vue Router resolve.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
